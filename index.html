<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Concept design: Threads in chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--card:#1c1c1c;--bubble:#2f2f2f;--sheet:#171717;--line:#2e2e2e;--muted:#9a9a9a;--blue:#0285ff;--ease:cubic-bezier(.16,1,.3,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:#050505;color:#fff;font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
body{display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100%;max-width:402px;max-height:874px;background:var(--bg);overflow:hidden;--top:max(12px,env(safe-area-inset-top,0px))}
@media(min-width:500px){.app{border-radius:48px;border:1px solid #262626;--top:54px;height:min(100%,874px)}.status{display:flex!important}}
.status{display:none;position:absolute;top:0;left:0;right:0;height:54px;padding:18px 27px 0;font-weight:600;font-size:16px;z-index:5}
.head{position:absolute;top:var(--top);left:0;right:0;height:52px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.circ{width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid #333;display:grid;place-items:center}
.tag{position:absolute;left:72px;font-size:12px;color:var(--muted)}
.right{display:flex;gap:9px}
.tool{height:44px;width:106px;border-radius:22px;background:var(--card);border:1px solid #333;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.chat{position:absolute;inset:calc(var(--top) + 52px) 0 96px;overflow-y:auto;padding:20px 16px 24px}
.user{margin-left:auto;width:fit-content;max-width:80%;background:var(--bubble);border-radius:23px;padding:12px 16px;font-size:16px}
#ans{margin-top:40px;font-size:17px;line-height:27px;-webkit-user-select:text;user-select:text}
#ans ::selection,#ans::selection{background:#0a5b8f;color:#fff}
.lnk{color:var(--blue);cursor:pointer}
.pill{display:flex;align-items:center;gap:8px;margin-top:14px;height:30px;padding:0 12px 0 11px;border-radius:15px;background:#111;border:1px solid var(--line);color:var(--blue);font-size:14px;font-weight:600}
.pill .ic{width:15px;height:15px}
.pill[hidden],#dir[hidden],#hint[hidden]{display:none}
.acts{display:flex;gap:20px;margin-top:14px;color:#ddd}.acts .ic{width:18px;height:18px}
#hint{margin-top:28px;font-size:13px;color:#6f6f6f;max-width:300px}
.comp{position:absolute;left:38px;right:38px;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:50px;border-radius:25px;background:#1d1d1d;border:1px solid #363636;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px}
.comp input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px}
.comp input::placeholder{color:#777}
.comp .ic{color:#aaa}
.go{width:34px;height:34px;border-radius:17px;background:#0aa0ff;display:grid;place-items:center;color:#fff}
.go .ic{color:#fff;stroke-width:2.4;width:18px;height:18px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:6}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:28px 28px 0 0;border:1px solid #262626;border-bottom:0;transform:translateY(102%);transition:transform .34s var(--ease);z-index:7;display:flex;flex-direction:column}
.sheet.on{transform:none}
#tsheet{height:64%}#asheet{height:80%}
.grab{padding:10px 0 14px;touch-action:none;cursor:grab;flex:none}
.grab i{display:block;width:36px;height:5px;border-radius:3px;background:#3d3d3d;margin:0 auto}
.sh{padding:0 20px 12px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;flex:none}
.badge{min-width:24px;height:24px;border-radius:12px;background:#243b5c;color:#6db2ff;font-size:12px;display:grid;place-items:center;padding:0 7px}
.body{flex:1;overflow-y:auto;padding:4px 16px 16px}
.msg{margin:12px 0;font-size:16px}
.msg.u{margin-left:auto;width:fit-content;max-width:80%;background:var(--bubble);border-radius:20px;padding:9px 14px}
.empty{color:#707070;font-size:14px;margin-top:6px}
.dots{color:var(--muted)}
#tsheet .comp{position:relative;left:auto;right:auto;bottom:auto;margin:6px 38px calc(20px + env(safe-area-inset-bottom,0px));flex:none}
.day{font-size:13px;color:var(--muted);margin:14px 4px 6px}
.row{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid #232323}
.row b{display:block;font-weight:500;font-size:17px}
.row q{display:block;color:var(--muted);font-size:14px;margin-top:3px;quotes:"\201C" "\201D";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:#707070;font-size:12px;margin-top:6px}
.menu{position:absolute;z-index:8;display:none;align-items:center;height:40px;border-radius:14px;background:#262626;border:1px solid #3a3a3a;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:0 4px;font-size:14px;white-space:nowrap}
.menu.on{display:flex}
.menu button{height:30px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:7px}
.menu .ask{color:var(--blue);background:rgba(2,133,255,.16);font-weight:500}
.menu .ic{width:15px;height:15px}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-side" viewBox="0 0 24 24"><path d="M5 9h14M5 15h9"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 4H8a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-4M17 3.5 20.5 7 12 15.5 8.5 16l.5-3.5z"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
<symbol id="i-tree" viewBox="0 0 24 24"><path d="M5 4h5v5H5zM5 15h5v5H5zM14 6.5h5M14 17.5h5M7.5 9v6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M6 10v4M10 6v12M14 8v8M18 10v4"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></symbol>
<symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 11v8H4v-8zM7 11l4-7c1.5 0 2.5 1 2 3l-.5 3H18a2 2 0 0 1 2 2.3l-1 5A2 2 0 0 1 17 19H7"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
</defs></svg>

<main class="app" id="app">
  <div class="status"><span>9:41</span></div>
  <header class="head">
    <button class="circ" aria-label="Sidebar"><svg class="ic"><use href="#i-side"/></svg></button>
    <span class="tag">Concept design</span>
    <div class="right">
      <button class="circ" id="dir" aria-label="All threads"><svg class="ic"><use href="#i-tree"/></svg></button>
      <div class="tool"><svg class="ic"><use href="#i-edit"/></svg><svg class="ic"><use href="#i-dots"/></svg></div>
    </div>
  </header>

  <section class="chat" id="chat">
    <div class="user">Recipe for cappuccino</div>
    <p id="ans"></p>
    <button class="pill" id="pill" hidden><svg class="ic"><use href="#i-chat"/></svg><span id="pillN">Threads</span><svg class="ic"><use href="#i-chev"/></svg></button>
    <div class="acts"><svg class="ic"><use href="#i-copy"/></svg><svg class="ic"><use href="#i-thumb"/></svg><svg class="ic"><use href="#i-share"/></svg><svg class="ic"><use href="#i-dots"/></svg></div>
    <p id="hint">Press and hold, or drag over, any words in the reply to try it. Replies in threads are scripted for this demo.</p>
  </section>

  <div class="comp"><svg class="ic"><use href="#i-plus"/></svg><input readonly placeholder="Ask ChatGPT" aria-label="Message"><svg class="ic"><use href="#i-mic"/></svg><span class="go"><svg class="ic"><use href="#i-wave"/></svg></span></div>

  <div class="menu" id="menu" role="menu">
    <button class="ask" id="mAsk"><svg class="ic"><use href="#i-chat"/></svg>Ask about this</button>
    <button id="mCopy">Copy</button><button id="mAll">Select All</button>
  </div>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="tsheet" aria-label="Thread">
    <div class="grab" id="g1"><i></i></div>
    <h2 class="sh" id="tTitle"></h2>
    <div class="body" id="tBody"></div>
    <div class="comp"><svg class="ic"><use href="#i-plus"/></svg><input id="tIn" placeholder="Ask a follow-up" aria-label="Ask a follow-up" autocomplete="off"><svg class="ic" id="tMic"><use href="#i-mic"/></svg><button class="go" id="tGo" aria-label="Send"><svg class="ic"><use id="tUse" href="#i-wave"/></svg></button></div>
  </section>

  <section class="sheet" id="asheet" aria-label="All threads">
    <div class="grab" id="g2"><i></i></div>
    <h2 class="sh">All threads <span class="badge" id="aCount">0</span></h2>
    <div class="body" id="aBody"></div>
  </section>
</main>

<script>
const TEXT="A good cappuccino is all about balancing three things: rich espresso, smooth chocolate, and creamy milk. Here\u2019s a simple way to make one at home that tastes like a cafe version.";
const $=s=>document.querySelector(s), ans=$('#ans'), menu=$('#menu'), app=$('#app');
let threads=[], cur=null, pending=null, timer=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

function renderAns(){
  let h='',i=0;
  [...threads].sort((a,b)=>a.s-b.s).forEach(t=>{h+=esc(TEXT.slice(i,t.s))+`<span class="lnk" data-id="${t.id}">${esc(TEXT.slice(t.s,t.e))}</span>`;i=t.e});
  ans.innerHTML=h+esc(TEXT.slice(i));
  const n=threads.length;
  $('#pill').hidden=!n; $('#hint').hidden=!!n;
  $('#pillN').textContent=n+(n===1?' thread':' threads');
}

/* selection -> menu */
function selInfo(){
  const s=getSelection(); if(!s.rangeCount||s.isCollapsed) return null;
  const r=s.getRangeAt(0); if(!ans.contains(r.commonAncestorContainer)) return null;
  const pre=document.createRange(); pre.selectNodeContents(ans); pre.setEnd(r.startContainer,r.startOffset);
  let txt=r.toString(), st=pre.toString().length+(txt.length-txt.trimStart().length); txt=txt.trim();
  return txt?{s:st,e:st+txt.length,rect:r.getBoundingClientRect()}:null;
}
function hideMenu(){menu.classList.remove('on');pending=null}
document.addEventListener('selectionchange',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const i=selInfo(); if(!i){ if(!menu.matches(':hover')) hideMenu(); return }
    pending=i; menu.classList.add('on');
    const a=app.getBoundingClientRect(), w=menu.offsetWidth;
    let top=i.rect.bottom-a.top+10; if(top>a.height-200) top=i.rect.top-a.top-50;
    menu.style.top=top+'px';
    menu.style.left=Math.max(12,Math.min(i.rect.left-a.left,a.width-w-12))+'px';
  },160);
});
menu.addEventListener('mousedown',e=>e.preventDefault());
$('#mAsk').onclick=()=>{
  const p=pending; if(!p) return; hideMenu(); getSelection().removeAllRanges();
  let t=threads.find(t=>p.s<t.e&&p.e>t.s);
  if(!t){t={id:Date.now(),s:p.s,e:p.e,phrase:TEXT.slice(p.s,p.e),msgs:[],at:new Date()};threads.push(t);renderAns()}
  openThread(t.id);
};
$('#mCopy').onclick=()=>{try{navigator.clipboard.writeText(getSelection().toString())}catch(e){}hideMenu();getSelection().removeAllRanges()};
$('#mAll').onclick=()=>{const r=document.createRange();r.selectNodeContents(ans);const s=getSelection();s.removeAllRanges();s.addRange(r)};

/* sheets */
const scrim=$('#scrim'), ts=$('#tsheet'), as=$('#asheet');
function closeAll(){
  ts.classList.remove('on');as.classList.remove('on');scrim.classList.remove('on');
  if(cur&&!cur.msgs.length){threads=threads.filter(t=>t!==cur);renderAns()}
  cur=null;
}
scrim.onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
[['g1',ts],['g2',as]].forEach(([id])=>{
  const g=$('#'+id); let y0=null;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(y0!==null&&e.clientY-y0>60){y0=null;closeAll()}});
  g.addEventListener('pointerup',e=>{if(y0!==null&&Math.abs(e.clientY-y0)<6)closeAll();y0=null});
});

/* thread */
function openThread(id){
  as.classList.remove('on');
  cur=threads.find(t=>t.id===id); if(!cur) return;
  $('#tTitle').textContent=cur.phrase; drawThread();
  ts.classList.add('on'); scrim.classList.add('on');
  setTimeout(()=>$('#tIn').focus({preventScroll:true}),380);
}
function drawThread(){
  const b=$('#tBody');
  b.innerHTML=cur.msgs.length||cur.wait?cur.msgs.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')+(cur.wait?'<div class="msg dots">\u2026</div>':''):`<p class="empty">Ask anything about \u201C${esc(cur.phrase)}\u201D. The main chat stays as it is.</p>`;
  b.scrollTop=b.scrollHeight;
}
function reply(q,p){
  const l=q.toLowerCase();
  if(/\b(g|gram|grams|quantity|much|ml)\b/.test(l)) return 'For a standard cappuccino, use about 18 g of ground coffee for a double shot, with roughly 120 ml of steamed milk.';
  if(/(why|how|what|which|can|should)/.test(l)) return `On \u201C${p}\u201D: it shapes the balance of the drink, and small changes are easy to try. Start with the basics and adjust to taste.`;
  return `Good point about \u201C${p}\u201D. Tell me what you\u2019d like to tweak and I\u2019ll suggest a starting point.`;
}
function send(){
  const i=$('#tIn'), v=i.value.trim(); if(!v||!cur) return;
  i.value=''; upd(); const t=cur; t.msgs.push({r:'u',t:v}); t.wait=true; drawThread();
  setTimeout(()=>{t.wait=false;t.msgs.push({r:'a',t:reply(v,t.phrase)});if(cur===t)drawThread();if(as.classList.contains('on'))drawAll()},900);
}
function upd(){$('#tUse').setAttribute('href',$('#tIn').value.trim()?'#i-send':'#i-wave')}
$('#tIn').addEventListener('input',upd);
$('#tIn').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('#tGo').onclick=send;

/* all threads */
function drawAll(){
  $('#aCount').textContent=threads.length;
  const list=[...threads].sort((a,b)=>b.at-a.at);
  $('#aBody').innerHTML=list.length?`<div class="day">Today</div>`+list.map(t=>{
    const q=t.msgs.find(m=>m.r==='u');
    return `<button class="row" data-id="${t.id}"><b>${esc(q?q.t:t.phrase)}</b><q>${esc(t.phrase)}</q><small>Created ${fmt(t.at)}</small></button>`}).join(''):'<p class="empty">No threads yet. Select words in the reply to start one.</p>';
}
function openAll(){drawAll();ts.classList.remove('on');as.classList.add('on');scrim.classList.add('on');hideMenu()}
$('#pill').onclick=openAll; $('#dir').onclick=openAll;
$('#aBody').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openThread(+r.dataset.id)});
ans.addEventListener('click',e=>{const l=e.target.closest('.lnk');if(l&&getSelection().isCollapsed)openThread(+l.dataset.id)});

renderAns();
</script>
</body>
</html>
